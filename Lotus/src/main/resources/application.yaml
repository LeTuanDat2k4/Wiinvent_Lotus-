spring:
  application:
    name: Lotus
  datasource:
    url: jdbc:postgresql://localhost:5432/lotus
    username: lotus
    password: lotus
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  data:
    redis:
      host: localhost
      port: 6379
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

lotus:
  jwt:
    secret: ${JWT_SECRET:lotus-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  internal-api-key: ${INTERNAL_API_KEY:lotus-internal-dev-key}
  admin:
    phone: "0900000000"
    display-name: Admin
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}

server:
  port: 8080
